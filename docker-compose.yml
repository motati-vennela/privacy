version: '3.8'

services:
  source-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - source_data:/var/lib/postgresql/data

  protected-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: protected_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - protected_data:/var/lib/postgresql/data

  vault-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - vault_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SOURCE_DATABASE_URL=postgresql://postgres:postgres@source-db:5432/source_db
      - PROTECTED_DATABASE_URL=postgresql://postgres:postgres@protected-db:5432/protected_db
      - VAULT_DATABASE_URL=postgresql://postgres:postgres@vault-db:5432/vault_db
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      - source-db
      - protected-db
      - vault-db
      - mailhog

volumes:
  source_data:
  protected_data:
  vault_data:
